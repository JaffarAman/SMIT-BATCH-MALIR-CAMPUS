    <fieldset class="formContainer">
        <legend class="heading" >Signup Form</legend>

        <div>
            <input type="text" class="inputField" placeholder="Enter Your First Name">
            <input type="text" class="inputField" placeholder="Enter Your Last Name">
            <div class="genderContainer" >
                <p>Select Your Gender</p>
                <label for="male">
                    Male
                    <input type="radio" name="gender" id="male" >
                </label>
                <label for="female">
                    FeMale
                    <input type="radio" name="gender" id="female" >
                </label>
            </div>
            <input type="text" class="inputField" placeholder="Enter Your Email Address">
            <input type="text" class="inputField" placeholder="Enter Your Password">
            <input type="text" class="inputField" placeholder="Enter Your Confirm Password">
            <button class="btn" >Signup</button>
        
        </div>


    </fieldset>
